minimum_pre_commit_version: "3.2.0"
default_stages: [pre-commit]

# Keep immutable revisions with readable release labels.
# Refresh with: pre-commit autoupdate --freeze
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        # Application code and datasets belong in the registered source repositories.
        args: [--maxkb=1024, --enforce-all]
      - id: check-case-conflict
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: c0f278f1254ccc8fb09676bcdb8d847e7db493e5  # frozen: v0.17.4
    hooks:
      - id: ruff-check
        # Check Python correctness and stray debuggers without imposing a formatter.
        # Ignore parent-directory configuration so local and CI results agree.
        args: [--isolated, '--select=E4,E7,E9,F,T100', --target-version=py312]

  - repo: local
    hooks:
      - id: validate-registry
        name: validate offline source registrations
        entry: python utilities/validate_registry.py
        language: python
        # Only the offline validator's dependencies; keep aligned with requirement.txt.
        additional_dependencies:
          - jsonschema==4.26.0
          - rfc3986-validator==0.1.1
        # Validate the whole registry, including unexpected files, symlinks, and
        # deletions that filename/type filters would miss. This check is fast and offline.
        always_run: true
        pass_filenames: false
