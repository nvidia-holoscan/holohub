name: "🗂️ Register/Update a Source"
description: Add an application, module, tutorial, skill, or benchmark to HoloHub, or update or remove an existing registration.
title: "🗂️ Registry request"
body:
  - type: markdown
    attributes:
      value: |
        HoloHub records where each project lives. Its code, descriptions, and tags stay in the project's own repository. After you submit this form, a bot checks your request, renames the issue after it, and opens a pull request for the maintainers to review.

        **Register a new source:** fill in every required field below. To prepare your project first, see the guides for creating an [application](https://github.com/nvidia-holoscan/holohub/blob/main/applications/README.md#create-a-new-application), [module](https://github.com/nvidia-holoscan/holohub/blob/main/modules/README.md#create-a-new-module), [tutorial](https://github.com/nvidia-holoscan/holohub/blob/main/tutorials/README.md#create-a-new-tutorial), or [skill](https://github.com/nvidia-holoscan/holohub/blob/main/skills/README.md#create-a-new-skill).

        **Update a registered source:** enter its Kind and Name plus only the fields you want to change. Blank fields keep their current values, and `none` clears an optional value.

        **Remove a registered source:** enter its Kind and Name, then tick **Remove**.

  - type: input
    id: kind
    attributes:
      label: Kind
      description: application, module, tutorial, skill, or benchmark.
      placeholder: application
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Name
      description: The registered name, or a new one using lowercase letters, numbers, and single hyphens or underscores between words.
      placeholder: my-application
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Source URL
      description: HTTPS Git clone URL, or a direct link to a hosted metadata.json or SKILL.md. Required for a new source.
      placeholder: https://github.com/owner/project.git
  - type: input
    id: ref
    attributes:
      label: Git revision
      description: A branch, a tag, or (most reproducible) a full commit SHA. Leave blank to use a Git repository's default branch, or for a hosted metadata.json or SKILL.md. When changing a registered Git repository to a hosted file, enter `none` to clear the stored revision.
      placeholder: 0123456789abcdef0123456789abcdef01234567
  - type: input
    id: path
    attributes:
      label: Repository path
      description: Optional directory in the Git repository that holds the project or collection. Use "." for the repository root.
      placeholder: applications
  - type: input
    id: issues-url
    attributes:
      label: Issue tracker URL
      description: Optional HTTPS page where users report problems with this source. Leave blank to use the issue tracker of a GitHub or GitLab repository when it has one.
      placeholder: https://github.com/owner/project/issues
  - type: checkboxes
    id: remove
    attributes:
      label: Remove
      options:
        - label: Remove this registration from HoloHub. The project itself is not changed.
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Describe the source or the change. When removing a source, link any replacement.
    validations:
      required: true
