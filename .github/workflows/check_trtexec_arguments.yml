name: Check TensorRT conversion arguments

on:
  pull_request:
    paths:
      - 'utilities/generate_trt_engine.py'
      - 'utilities/test_generate_trt_engine.py'
      - 'conftest.py'
      - 'pyproject.toml'
      - '.github/workflows/check_trtexec_arguments.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install pytest==9.1.1 numpy==2.5.3 \
            cupy-cuda12x==13.6.0 nvidia-cuda-runtime-cu12==12.9.79
      - name: Test argument forwarding and error handling
        run: |
          export LD_LIBRARY_PATH="$(python -c 'import site; print(site.getsitepackages()[0])')/nvidia/cuda_runtime/lib"
          python -c "import cupy, numpy"
          python -m pytest -v utilities/test_generate_trt_engine.py
