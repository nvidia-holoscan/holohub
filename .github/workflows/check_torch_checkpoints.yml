name: Check PyTorch checkpoint security

on:
  pull_request:
    paths:
      - 'applications/imaging_ai_segmentator/**'
      - 'applications/xr_gsplat/**'
      - 'conftest.py'
      - 'pyproject.toml'
      - '.github/workflows/check_torch_checkpoints.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.10.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest==9.1.1 numpy==2.5.3 holoscan==4.6.0 \
            cupy-cuda12x==13.6.0 nvidia-cuda-runtime-cu12==12.9.79 monai==1.5.2
      - name: Test checkpoint loading
        run: |
          ulimit -s 32768
          export LD_LIBRARY_PATH="$(python -c 'import site; print(site.getsitepackages()[0])')/nvidia/cuda_runtime/lib"
          python -c "import holoscan.core, numpy, torch, monai; assert torch.version.cuda is None"
          python -m pytest -v applications/imaging_ai_segmentator/test_monai_totalseg_operator.py \
            applications/xr_gsplat/test_gsplat_loader_op.py
