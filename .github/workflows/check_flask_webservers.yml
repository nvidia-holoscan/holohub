name: Check Flask webserver security

on:
  push:
    branches: [main]
    paths:
      - 'applications/vila_live/**'
      - 'applications/ehr_query_llm/lmm/**'
      - 'utilities/testing/test_webserver_security.py'
      - 'conftest.py'
      - 'pyproject.toml'
      - '.github/workflows/check_flask_webservers.yml'
  pull_request:
    paths:
      - 'applications/vila_live/**'
      - 'applications/ehr_query_llm/lmm/**'
      - 'utilities/testing/test_webserver_security.py'
      - 'conftest.py'
      - 'pyproject.toml'
      - '.github/workflows/check_flask_webservers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install pytest==9.1.1 numpy==2.5.3 flask==3.1.3 websockets==13.0
      - name: Test HTTP error responses
        run: |
          python -m pytest -v utilities/testing/test_webserver_security.py
