name: Check hyperspectral input security

on:
  push:
    branches: [main]
    paths:
      - 'applications/hyperspectral_segmentation/**'
      - 'conftest.py'
      - 'pyproject.toml'
      - '.github/workflows/check_hyperspectral_input.yml'
  pull_request:
    paths:
      - 'applications/hyperspectral_segmentation/**'
      - 'conftest.py'
      - 'pyproject.toml'
      - '.github/workflows/check_hyperspectral_input.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest==9.1.1 numpy==2.5.3 blosc==1.11.4
      - name: Test numeric Blosc inputs and application wiring
        run: python -m pytest -v applications/hyperspectral_segmentation/tests/test_blosc_input.py
