name: Check gRPC transport security

on:
  pull_request:
    paths:
      - 'operators/grpc_operators/**'
      - 'applications/distributed/grpc/grpc_endoscopy_tool_tracking/python/**'
      - 'conftest.py'
      - 'pyproject.toml'
      - '.github/workflows/check_grpc_transport.yml'
  push:
    branches: [main]
    paths:
      - 'operators/grpc_operators/**'
      - 'applications/distributed/grpc/grpc_endoscopy_tool_tracking/python/**'
      - 'conftest.py'
      - 'pyproject.toml'
      - '.github/workflows/check_grpc_transport.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install pytest==9.1.1 numpy==2.5.3 holoscan==4.6.0 \
            cupy-cuda12x==13.6.0 nvidia-cuda-runtime-cu12==12.9.79 \
            grpcio==1.70.0 grpcio-tools==1.70.0 grpcio-health-checking==1.70.0 \
            protobuf==5.29.6 cryptography==50.0.1
      - name: Test authenticated transport over real sockets
        run: |
          ulimit -s 32768
          export LD_LIBRARY_PATH="$(python -c 'import site; print(site.getsitepackages()[0])')/nvidia/cuda_runtime/lib"
          python -c "import holoscan.core, numpy, cupy, grpc, grpc_health, grpc_tools.protoc, cryptography"
          python -m pytest -v operators/grpc_operators/python/server/test_grpc_service.py
