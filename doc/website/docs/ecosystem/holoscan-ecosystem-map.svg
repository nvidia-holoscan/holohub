<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" role="img" aria-labelledby="ecosystem-map-title" aria-describedby="ecosystem-map-description" style="width: 100%; max-width: 760px; height: auto; display: block; margin: 1.5rem auto;">
  <title id="ecosystem-map-title">Holoscan SDK, external modules, and developer tools</title>
  <desc id="ecosystem-map-description">Applications use the Holoscan SDK and optional external modules. The SDK contains core modules for inference, vision, and visualization, built on core libraries for graphs, operators, and HoloMQ. External modules also build on the SDK core libraries. HoloHub provides discovery and examples, and Holoscan CLI builds, runs, and tests projects. Those developer tools are shown separately from runtime dependencies.</desc>
  <defs>
    <marker id="ecosystem-map-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="currentColor" />
    </marker>
  </defs>
  <g font-family="'NVIDIA Sans', Arial, Helvetica, sans-serif" fill="currentColor">
    <rect x="20" y="20" width="720" height="70" rx="8" opacity="0.06" />
    <rect x="20" y="20" width="720" height="70" rx="8" fill="none" stroke="currentColor" stroke-width="1.5" />
    <text x="380" y="49" text-anchor="middle" font-size="18" font-weight="600">Your application</text>
    <text x="380" y="73" text-anchor="middle" font-size="14">Use SDK core libraries and select the modules you need</text>
    <path d="M248,90 V145" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ecosystem-map-arrow)" />
    <path d="M620,90 V190" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ecosystem-map-arrow)" />
    <text x="262" y="122" font-size="14">uses</text>
    <text x="634" y="143" font-size="14">optional</text>
    <rect x="20" y="145" width="455" height="230" rx="8" fill="none" stroke="#76B900" stroke-width="2" />
    <text x="248" y="174" text-anchor="middle" font-size="18" font-weight="600">Holoscan SDK</text>
    <rect x="40" y="190" width="415" height="65" rx="8" fill="none" stroke="currentColor" stroke-width="1.5" />
    <text x="248" y="216" text-anchor="middle" font-size="16" font-weight="600">SDK core modules</text>
    <text x="248" y="239" text-anchor="middle" font-size="14">Inference · Vision · Visualization</text>
    <path d="M248,255 V293" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ecosystem-map-arrow)" />
    <rect x="40" y="293" width="415" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="1.5" />
    <text x="248" y="319" text-anchor="middle" font-size="16" font-weight="600">SDK core libraries</text>
    <text x="248" y="342" text-anchor="middle" font-size="14">Graphs · Operators · HoloMQ</text>
    <rect x="500" y="190" width="240" height="65" rx="8" fill="none" stroke="currentColor" stroke-width="1.5" />
    <text x="620" y="216" text-anchor="middle" font-size="16" font-weight="600">External modules</text>
    <text x="620" y="239" text-anchor="middle" font-size="14">NVIDIA and community projects</text>
    <path d="M620,255 V325 H455" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ecosystem-map-arrow)" />
    <text x="635" y="290" font-size="14">build on</text>
    <text x="380" y="408" text-anchor="middle" font-size="16" font-weight="600">Developer tools and discovery</text>
    <rect x="20" y="426" width="345" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="1.5" />
    <text x="193" y="452" text-anchor="middle" font-size="16" font-weight="600">HoloHub</text>
    <text x="193" y="475" text-anchor="middle" font-size="14">Discover components and examples</text>
    <rect x="395" y="426" width="345" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="1.5" />
    <text x="568" y="452" text-anchor="middle" font-size="16" font-weight="600">Holoscan CLI</text>
    <text x="568" y="475" text-anchor="middle" font-size="14">Build, run, and test projects</text>
  </g>
</svg>
